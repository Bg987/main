<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech to Text</title>
</head>
<body>
  <h1>Speech to Text for Movie Reviews</h1>
  <button id="start">Start Recording</button>
  <p id="output"></p>
  <textarea id="reviewText" rows="5" cols="50" placeholder="Your review will appear here..."></textarea>

  <script>
    const startButton = document.getElementById("start");
    const output = document.getElementById("output");
    const reviewText = document.getElementById("reviewText");

    // Check if the browser supports the Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      output.textContent = "Your browser does not support speech recognition.";
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;

      startButton.addEventListener("click", () => {
        recognition.start();
        output.textContent = "Listening...";
      });

      recognition.addEventListener("result", (event) => {
        const transcript = event.results[0][0].transcript;
        reviewText.value += transcript + " ";
        output.textContent = "Speech captured!";
      });

      recognition.addEventListener("end", () => {
        output.textContent = "Click 'Start Recording' to capture more speech.";
      });

      recognition.addEventListener("error", (event) => {
        output.textContent = "Error: " + event.error;
      });
    }
  </script>
</body>
</html>
